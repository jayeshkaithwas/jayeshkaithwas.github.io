<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Jayesh Kaithwas</title>
  <!--
    A reversed J with a burnt rule under it.

    Drawn on the 16-unit grid with whole-number coordinates so the strokes land
    on whole pixels at tab size rather than going soft. Reversed on purpose: a
    solid dark tile holds its shape against both light and dark browser chrome,
    where an outlined mark on the paper ground disappears into a busy tab strip.

    The earlier torii was dropped because two posts and a crossbar read as an H
    at 16px, which is the one thing a favicon must not do — look like a letter
    that isn't yours.
  -->
  <style>
    .tile   { fill: #14120e }
    .letter { fill: #f2efe6 }
    .rule   { fill: #c2410c }
    @media (prefers-color-scheme: dark) {
      .tile   { fill: #f2efe6 }
      .letter { fill: #14120e }
      .rule   { fill: #c2410c }
    }
  </style>
  <rect class="tile"   width="16" height="16"/>
  <rect class="letter" x="8" y="2"  width="3"  height="10"/>
  <rect class="letter" x="3" y="9"  width="8"  height="3"/>
  <rect class="letter" x="3" y="7"  width="3"  height="3"/>
  <rect class="rule"   x="3" y="13" width="10" height="2"/>
</svg>
